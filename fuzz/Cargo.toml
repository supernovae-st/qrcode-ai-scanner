[package]
name = "qrcode-ai-scanner-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qrcode-ai-scanner = { path = "../crates/qrcode-ai-scanner" }

[[bin]]
name = "fuzz_scan_encoded"
path = "fuzz_targets/fuzz_scan_encoded.rs"
test = false
doc = false
bench = false

# standalone — never a member of the parent workspace (cargo-fuzz layout)
[workspace]

[[bin]]
name = "fuzz_classify_text"
path = "fuzz_targets/fuzz_classify_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_scan_full"
path = "fuzz_targets/fuzz_scan_full.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_rescue_bitstream"
path = "fuzz_targets/fuzz_rescue_bitstream.rs"
test = false
doc = false
bench = false

# cargo-mutants dispositions — the ratchet behind the weekly mutation verdict.
#
# deep-checks.yml's mutants-summary job runs
#   python3 scripts/check-mutants-outcome.py \
#     --dispositions .cargo/mutants-dispositions.toml <one dir per shard>
# and FAILS on a baseline failure, a shard that did not finish, or any MISSED
# or TIMEOUT mutant without an entry here whose category covers it. Caught
# and unviable mutants never need one. `--self-test` replays every entry
# below against its own category, plus one injected miss: run it after an
# edit.
#
# Identity = file + line + column + mutation, exactly as cargo-mutants prints
# `file:line:col: mutation` (mutation strings stay verbatim on one line, so a
# run log greps straight back to its entry). Anchored ON PURPOSE, like the
# exclusions in .cargo/mutants.toml: a function-scoped match would accept a
# killable sibling. Drift is safe: the moved mutant resurfaces
# undispositioned, the report names the stale entry it probably was, and a
# human re-anchors it after re-checking the argument. Entries that match
# nothing are listed as stale, never failed — prune them when re-anchoring.
#
#   category            covers            meaning
#   equivalent          MISSED            no deterministic test can tell it
#                                         apart (argued in .cargo/mutants.toml)
#   timeout-structural  TIMEOUT           it can only show up as a hang; the
#                                         suite timeout IS the catch
#   debt                MISSED, TIMEOUT   a test should kill it — recorded,
#                                         NOT excused; kill it, delete the entry
#
# Seed (2026-10-09): every line:col below is an anchor in commit 1c38d7c, the
# tree weekly run 37262272113 measured on 2026-10-05 — 2097 mutants, 1879
# caught, 77 missed, 5 timeouts, 136 unviable, and a green workflow over 12
# of 16 shards exiting 2 or 3.
#   21 equivalent: the set argued in .cargo/mutants.toml. Nine resurfaced as
#      MISSED at drifted lines (transform.rs, lib.rs and ladder.rs grew after
#      its anchors were set) and are anchored where they surfaced; the other
#      twelve still match their exclusion there.
#    5 timeout-structural: the two caught-by-timeout mutants documented in
#      .cargo/mutants.toml, plus three hangs first seen in that run.
#   69 debt: the other 68 MISSED of that run, plus one TIMEOUT that is a
#      resource blow-up rather than a hang (warp.rs rotate) — surviving
#      mutants recorded at 1c38d7c, to be killed by tests (debt, not
#      equivalence).
# Known drift already: the capped-rescue fix after 1c38d7c added 17 lines to
# ladder.rs above both Run equivalents (710:49 and 786:49 now sit 17 lines
# lower); the report names them on the next run. .cargo/mutants.toml keeps
# its own anchors for now — both files are re-anchored together once the
# open edits to the anchored sources land.


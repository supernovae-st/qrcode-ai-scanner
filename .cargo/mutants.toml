# cargo-mutants policy.
#
# nextest as the test tool — NOT a speed preference: .config/nextest.toml
# serializes the wall-clock test group (the three stock-budget artistic
# integration tests), and that grouping only exists under nextest. Plain
# `cargo test` runs them fully parallel, so a loaded machine flakes the
# BASELINE of local + sharded-CI mutants runs (observed 2026-07-05 under
# three concurrent builds). Trailing `-- --all-features` args stay valid
# (a cargo build flag, shared by both harnesses).
test_tool = "nextest"
#
# The `fuzzing::` bridge (lib.rs `#[cfg(fuzzing)] pub mod fuzzing`) exists
# ONLY for the fuzz targets — unit tests never exercise it, so every mutant
# there is a structural MISSED (the cfg is off under `cargo mutants`, the
# gutted fn never even compiles into the test build). Weekly run 28740297335
# reported exactly that noise class; exclude it so `missed` stays a real
# assertion-gap signal.
# (matched against the full mutant line, which starts with the file path —
# never anchor.) Both bridge layers: lib.rs `fuzzing::` re-exports and the
# rescue-internal `fuzz_api::` it forwards to.
#
# Below the bridge class: the 14 PROVEN-EQUIVALENT mutants from the
# 2026-07-05 full-file proof runs (each argued in commits 63d5895 + this
# one; re-derive before touching). Anchored line:col ON PURPOSE — a
# fn-scoped operator pattern would swallow killable siblings (e.g. 9
# CAUGHT `< with <=` live in reserved_cell next to the 2 equivalents).
# Line drift makes an entry stale in the SAFE direction: the known
# equivalent resurfaces in the weekly report and gets re-anchored; a
# killable mutant is never hidden.
#
# transform.rs
#   235:87 / 238:96  downscale `.max(y0+1)`/`.max(x0+1)` `+`→`*`: h ≥ new_h
#     always in a downscale, the guard never binds (upscale-only defense).
#   347:45  `-`→`+`/`/` in `.min(n - 1)`: the clamp only fires when the
#     catch-up loop is empty either way (prev_hi ≥ hi at that point).
#   348:31  `prev_hi + 1`→`* 1`: re-push of the back index; `dominates` is
#     non-strict, so the equal-value copy pops its original — deque
#     bit-identical.
#   367:24  `(k | 1)`→`^`: for m = k.max(3), (m|1)/2 == (m^1)/2 for all m
#     (integer-division identity, odd and even).
# score/structural.rs
#   98:33 / 100:30  `modules - 1 / offset` mirror: offsets {-2,-1} swap
#     their target rows/cols {modules, modules+1}; the aggregated
#     light/total count is order-independent.
#   111:11  `total > 0`→`>=`: total == 0 needs Homography::apply to return
#     None on all 96 ring probes while the interior still samples — a w≈0
#     band is a line and cannot contain a ring surrounding the interior.
# matrix/zigzag.rs
#   33:28 / 33:75  `i < 6`/`j < 6`→`<=` in the version-info arm: the
#     timing-pattern check (i == 6 || j == 6) returns first.
#   66:23 / 67:37  `%`→`+` inside is_multiple_of(2): +2 preserves parity
#     and %2 preserves value mod 2 — same predicate.
# lib.rs
#   87:9  `Scanner::builder`→`Default::default()`: the fn body already IS
#     `ScannerBuilder::default()`, and the `-> ScannerBuilder` return type
#     pins `Default::default()` to `<ScannerBuilder as Default>::default()`
#     — the byte-identical call. No test can distinguish them. The killable
#     builder siblings DISCARD state and ARE caught: `limits` (178:9) and
#     `profile` (171:9) drop the argument, `build` (185:9) recurses forever
#     via `Scanner::default` (timeout). This one alone is a true equivalent.
#
# ladder.rs — the wall-clock-SHRINK pair (NOT strict equivalents; untestable).
#   Both replace `* 1_000.0` with `/ 1_000.0` in a stage-scope seconds→ms
#   conversion (`started.elapsed().as_secs_f64() * 1_000.0`). They shrink the
#   reported `ms` by 1e6 to a smaller-but-still-positive value.
#   511:49  Run::rescue_stage `ms`  ·  587:49  Run::stage `ms`
#   The three KILLABLE siblings are caught (ladder_mutant_kills): the `+ 1000`
#   inflations blow past the `stage.ms <= total_ms` sub-interval invariant
#   (587 `+`, and the rescue unit's `rescue.ms < 100`), and the TOTAL-scope
#   `/ 1000` (806:55) drops total below a real stage's ms. A STAGE-scope `/`
#   has no machine-independent distinguisher: `ms` is a documented wall-clock
#   field, explicitly excluded from the determinism contract (lib.rs
#   §Deterministic + the determinism tests skip it), and catching a shrunk-
#   but-positive elapsed needs a machine-speed LOWER bound ("this stage took
#   ≥ N ms") — a flaky timing assumption the crate's own doctrine forbids.
#   Line drift stays SAFE: the mutant resurfaces in the weekly report and gets
#   re-anchored; no killable sibling is ever hidden (the operator/count is
#   pinned to the `*`→`/` variant only, never the `*`→`+` twin).
# gs1.rs
#   227:15  `cut > 0`→`>=` in split_head's char-boundary down-walk: cut is
#     usize so `cut >= 0` is vacuously true and the guard collapses to
#     `!s.is_char_boundary(cut)` — but is_char_boundary(0) is always true
#     (string start), so both guards stop at the same index for every &str.
#     Survived per-mutation isolation while its `-=`→`+=` sibling died.
# rescue/bitstream.rs
#   144:53  `|`→`^` in the ECI assembly `(v / 0xC0) << 8 | (v % 0xC0)`: the
#     operands are bit-disjoint — v % 0xC0 < 0xC0 occupies bits 0-7 only,
#     (v / 0xC0) << 8 has all low 8 bits zero — so |, ^ and + are numerically
#     identical for every input. Unkillable by construction.
# score/uec.rs — census-proven equivalents (125,536-syndrome differential:
#   exhaustive npar=2 + 60k LCG npar=3..=8, hash-identical on each mutation).
#   Algebra: the truncated tail writes are gf_mul(coef, prev[k]) with
#   prev[k] = 0 wherever the written index could later be read — first-flip
#   prev is pristine [1,0,..], and afterwards the degree bound
#   ceil((r+1)/2) < len-1 forbids a discrepancy read of locator[len-1..].
#   The KILLABLE sibling at 52:30 (`+`→`-`, usize underflow at shift = len)
#   is caught by late_spike_syndrome_runs_the_fold_at_maximum_shift.
#   52:30  `len + 1 - shift`→`len * 1 - shift` in the flip-branch fold bound
#   61:30  both `+`→`-` and `+`→`*` in the else-branch fold bound (shift
#     there never exceeds len-1: it resets to 1 at every flip and the else
#     branch requires round < 2·degree — no underflow, same zero-tail).
exclude_re = [
    "replace fuzzing::",
    "replace fuzz_api::",
    "transform\\.rs:235:87: replace \\+ with \\* in downscale_to",
    "transform\\.rs:238:96: replace \\+ with \\* in downscale_to",
    "transform\\.rs:347:45: replace - with . in windowed_extremum_strided",
    "transform\\.rs:348:31: replace \\+ with \\* in windowed_extremum_strided",
    "transform\\.rs:367:24: replace \\| with \\^ in morph_filter",
    "structural\\.rs:98:33: replace - with / in quiet_zone_ok",
    "structural\\.rs:100:30: replace - with / in quiet_zone_ok",
    "structural\\.rs:111:11: replace > with >= in quiet_zone_ok",
    "zigzag\\.rs:33:28: replace < with <= in reserved_cell",
    "zigzag\\.rs:33:75: replace < with <= in reserved_cell",
    "zigzag\\.rs:66:23: replace % with \\+ in mask_bit",
    "zigzag\\.rs:67:37: replace % with \\+ in mask_bit",
    "lib\\.rs:87:9: replace Scanner::builder -> ScannerBuilder with Default::default\\(\\)",
    "ladder\\.rs:511:49: replace \\* with / in Run",
    "ladder\\.rs:587:49: replace \\* with / in Run",
    "gs1\\.rs:227:15: replace > with >= in split_head",
    "bitstream\\.rs:144:53: replace \\| with \\^ in parse",
    "uec\\.rs:52:30: replace \\+ with \\* in error_count",
    "uec\\.rs:61:30: replace \\+ with - in error_count",
    "uec\\.rs:61:30: replace \\+ with \\* in error_count",
]

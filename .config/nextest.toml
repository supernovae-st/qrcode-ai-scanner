# Wall-clock scheduling for the test suite.
#
# A score judgment the wall-clock budget cannot complete is ABSENT, so every
# score pin runs unbudgeted. One test in this group still scans with the
# stock Full profile — a 4 s wall-clock budget BY DESIGN — the decode-only
# `legacy_artistic_image_decodes_within_full_ladder`: on a saturated machine
# the budget cuts its ladder mid-flight and the decode assertion flakes
# (observed at load ≈ 100: it fails at ~4.1 s in a full parallel run, passes
# serially). The others are the suite's heaviest CPU consumers, which starve
# any budget running beside them: the artistic score pins (deep-ladder decode
# + full stress score), the threaded-determinism pin (four budget-free
# full-ladder scans at once) and the two score sweeps (one judgment per work
# quota of three symbols · one scan per budget step). All share one
# serialized group AND reserve every scheduler slot
# (`threads-required = "num-cpus"`): the group alone only serialized them
# against EACH OTHER while the other ~300 tests kept running beside them and
# starved the 4 s budget anyway (two different victims across three
# 2026-07-08 runs, ~4.2–5.2 s vs ~1.3 s solo). Slot reservation closes
# within-suite starvation; load from OTHER processes on a shared box remains
# the operator's to manage.

[test-groups]
wall-clock = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(artistic_image_that_decodes_must_not_score_zero) + test(blob_style_template_decodes_and_scores) + test(legacy_artistic_image_decodes_within_full_ladder) + test(concurrent_scans_yield_byte_identical_reports) + test(work_quota_cuts_are_absent_never_partial) + test(budget_cuts_never_ship_a_partial_judgment)'
test-group = 'wall-clock'
threads-required = "num-cpus"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # MPL-2.0 is NOT in the workspace graph — deny warns license-not-encountered
  # on the workspace scan. It covers the nine uniffi crates in the
  # workspace-EXCLUDED mobile tree, which ci.yml scans report-only against
  # this same config. Keep it; don't "fix" the warning by pruning. Same class
  # for the other unmatched allowances (LLVM-exception → the fuzz tree's
  # libfuzzer-sys; Unicode-3.0 → dual-licensed crates that deny satisfies via
  # MIT/Apache): an allowance is prunable ONLY once proven absent from ALL
  # five lockfile trees — CDLA-Permissive-2.0 died exactly that way, 2026-07-08.
  "MPL-2.0",
  "AGPL-3.0-or-later",
]

# allo-isolate 0.1.27 (flutter_rust_bridge hard dep) published with only
# `license-file = "LICENSE"` — crates.io metadata reads "non-standard" though
# the repo LICENSE is plain Apache-2.0 (github.com/shekohex/allo-isolate;
# fixed upstream in PR #69, merged 2025-09-01, unreleased as of 2026-07-05).
# Clarify pins the SPDX expression until a 0.1.28 ships the metadata.
[[licenses.clarify]]
crate = "allo-isolate"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0 }]

[advisories]
yanked = "deny"

[bans]
# Duplicate transitive versions are a warn (a nudge to dedup), not a hard fail —
# the engine crates (rxing/rqrr/image) pull a wide graph we don't fully control.
multiple-versions = "warn"
# A wildcard version requirement is a supply-chain hole (any future release is
# auto-accepted). We pin everything, so make a `*` dep a hard error — except the
# intra-workspace `path = "../…"` deps (which resolve to `*` but carry no
# registry risk); those are exempted by allow-wildcard-paths.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only. Every lockfile (workspace + the 3 foreign-toolchain trees)
# resolves 100% from crates.io today — no git deps — so unknown registries and
# unknown git sources are hard errors. Add an `allow-git`/`allow-org` entry here
# (with rationale) the day a vetted git dependency is genuinely needed.
unknown-registry = "deny"
unknown-git = "deny"

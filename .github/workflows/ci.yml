name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: python3 scripts/check-type-parity.py
      - run: cargo nextest run --workspace
      - run: cargo test --doc --workspace

  # MSRV floor — every manifest says rust-version 1.88 and jitpack.yml PINS
  # 1.88.0; stable-only CI lets MSRV rot land silently and break JitPack at
  # release time. Core crate is enough: the bindings inherit its floor.
  # (This job's first run proved the previously-declared 1.87 was fiction —
  # the code uses let-chains, stabilized in 1.88.)
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # --locked: the gate tests the COMMITTED dependency graph — without it
      # a fresh re-resolution can pull a dep whose MSRV floor moved (image
      # 0.25.10 → 1.88 did exactly that) and fail the job for the wrong
      # reason. Lockfile drift then fails loudly here instead.
      - run: cargo check -p qrcode-ai-scanner --all-features --locked

  wasm-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # rxing needs its wasm_support feature on wasm targets (chrono dep) —
      # the wasm binding crate (phase C) owns that wiring; the core shape
      # check runs rqrr-only to pin "core compiles single-thread, no rayon".
      - run: >
          cargo check -p qrcode-ai-scanner
          --target wasm32-unknown-unknown
          --no-default-features --features engine-rqrr,serde
      # The PUBLISHED wasm crate was previously never built on PRs — breakage
      # only surfaced at tag time (npm-publish.yml). Cheap check here.
      - run: >
          cargo check -p qrcode-ai-scanner-wasm
          --target wasm32-unknown-unknown

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # set -o pipefail: the default `bash -e {0}` run shell has NO pipefail —
      # `| tee` was swallowing a red corpus-report's exit 1 (gate held by luck).
      - run: set -o pipefail; cargo run -p xtask -- corpus-report | tee corpus-report.txt
      # corpus-external/ is not vendored: on CI this exercises the manifest
      # parse + the loud-skip path (locally, with corpora present, it gates).
      - run: set -o pipefail; cargo run -p xtask -- corpus-report --external | tee -a corpus-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: corpus-report.txt

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Workspace graph — the hard gate. advisories · bans · licenses · sources
      # (bans + sources are enforced by the [bans]/[sources] policy in deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      # The py · uniffi · flutter trees are workspace-EXCLUDED (foreign
      # toolchains: pyo3 · uniffi · flutter_rust_bridge) and ship their OWN
      # lockfiles the workspace scan never sees. Scan each against the same root
      # policy (--config deny.toml). Report-only / non-gating: their upstream
      # graphs carry advisories we surface LOUDLY (::warning annotation + full
      # log) but never blanket-ignore in deny.toml, and never block the pipeline
      # on foreign-toolchain upstream churn. Triage findings; fix or escalate.
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny · excluded binding trees (report-only)
        run: |
          for m in crates/qrcode-ai-scanner-py \
                   crates/qrcode-ai-scanner-uniffi \
                   bindings/flutter/rust; do
            echo "::group::cargo-deny $m"
            cargo deny --manifest-path "$m/Cargo.toml" check --config deny.toml \
              || echo "::warning file=$m/Cargo.toml::cargo-deny found issues in $m — triage (report, don't blanket-ignore)"
            echo "::endgroup::"
          done

name: npm-publish

# Builds the napi platform matrix + the wasm package and publishes both npm
# packages. Trigger: release tag vX.Y.Z.
#
# Publishing is tag-only: `publish-native` and `publish-wasm` run for
# refs/tags/v* alone. Any other run — a workflow_dispatch from a branch
# included — builds every binary, assembles every tarball exactly as it would
# ship and inspects it (scripts/package-inspect.py), then stops.
#
# Publishing authenticates through npm trusted publishing (GitHub OIDC): no
# token in the repo, provenance attestations generated automatically. Each of
# the eight packages binds this workflow file and the `npm` environment on
# npmjs.com first (RELEASING.md § Publishing). npm's CLI must be >= 11.5.1,
# which Node 24 ships, hence node-version 24 in the publish jobs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain CI tests (ci.yml RUST_TOOLCHAIN; RELEASING.md § toolchain).
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        # --use-napi-cross is Linux-gnu-only (napi CLI >=3.7.3 hard-errors on
        # mac/windows hosts AND on musl targets); darwin/windows rows build
        # natively, musl rides zig (-x + setup-zig + cargo-zigbuild, the
        # official napi-rs template recipe).
        settings:
          - { host: macos-latest, target: aarch64-apple-darwin, cross: "" }
          - { host: macos-latest, target: x86_64-apple-darwin, cross: "" }
          - { host: ubuntu-24.04, target: x86_64-unknown-linux-gnu, cross: "--use-napi-cross" }
          - { host: ubuntu-24.04, target: aarch64-unknown-linux-gnu, cross: "--use-napi-cross" }
          - { host: ubuntu-24.04, target: x86_64-unknown-linux-musl, cross: "-x" }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, cross: "" }
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: crates/qrcode-ai-scanner-node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.settings.target }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      # The one action here still declaring node20 (no node24 release yet):
      # since the runner dropped Node 20 it runs on Node 24 regardless.
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile=false
      # `-- --locked`: napi hands what follows `--` to cargo build. --no-js:
      # the committed native.js is what ships (it reads its own version);
      # napi's generated loader would bake the version in as a literal.
      - run: pnpm exec napi build --platform --release --target ${{ matrix.settings.target }} --no-js --dts native.d.ts ${{ matrix.settings.cross }} -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.settings.target }}
          path: crates/qrcode-ai-scanner-node/*.node
          if-no-files-found: error

  # The npm packages assembled exactly as they publish, on every run: the
  # per-target dirs napi generates — each given the AGPL LICENSE, since
  # `napi create-npm-dirs` writes only package.json + README — then the main
  # tarball and every platform tarball packed and read back.
  pack-native:
    needs: build-native
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/qrcode-ai-scanner-node
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - uses: actions/download-artifact@v8
        with:
          path: crates/qrcode-ai-scanner-node/artifacts
      # napi v3: scaffold the per-platform npm/<triple>/ dirs before artifacts
      - run: pnpm exec napi create-npm-dirs
      - run: pnpm exec napi artifacts
      - name: the AGPL text in every platform package
        run: |
          set -euo pipefail
          for dir in npm/*/; do
            cp LICENSE "$dir"
          done
      - name: pack + inspect the main tarball and every platform tarball
        working-directory: .
        run: python3 scripts/package-inspect.py node --platform-dirs crates/qrcode-ai-scanner-node/npm --strict --quiet
      - uses: actions/upload-artifact@v7
        with:
          name: npm-native-packages
          path: crates/qrcode-ai-scanner-node/npm
          if-no-files-found: error

  publish-native:
    needs: pack-native
    # refs/tags/v* only: no other ref reaches the registry.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + automatic provenance
    defaults:
      run:
        working-directory: crates/qrcode-ai-scanner-node
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The tag must name the version being published, and the CHANGELOG
      # must carry its dated section: a forgotten bump otherwise turns the
      # skip-if-live checks below into a silent non-release.
      - run: python3 ../../scripts/package-inspect.py versions --tag "$GITHUB_REF" --strict --quiet
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $v cannot publish through trusted publishing (needs >= 11.5.1)"
            exit 1
          fi
          echo "npm $v"
      - run: pnpm install --frozen-lockfile=false
      - uses: actions/download-artifact@v8
        with:
          name: npm-native-packages
          path: crates/qrcode-ai-scanner-node/npm
      # Self-detecting + idempotent: if the platform packages for THIS version are
      # already on npm (re-run / partial-publish recovery), skip re-publishing them;
      # otherwise publish fresh. No version-specific flag to remember. The
      # probes read the public registry directly: no credential involved.
      - name: detect already-published platform packages
        run: |
          VER=$(node -p "require('./package.json').version")
          if curl -fsS -o /dev/null "https://registry.npmjs.org/@supernovae-st%2fqrcode-ai-scanner-darwin-arm64/$VER"; then
            echo "platform packages already on npm @$VER - will skip optional publish"
            echo "SKIP_OPTIONAL=--skip-optional-publish" >> "$GITHUB_ENV"
          else
            echo "fresh release @$VER - platform packages will publish"
            echo "SKIP_OPTIONAL=" >> "$GITHUB_ENV"
          fi
      # pre-publish runs `npm publish` in every npm/<target>/ dir and pins
      # them in the main package's optionalDependencies.
      - run: pnpm exec napi pre-publish -t npm --no-gh-release ${SKIP_OPTIONAL:+"$SKIP_OPTIONAL"}
      # pre-publish rewrote package.json: read the tarballs back once more
      - name: re-inspect the tarballs about to publish
        working-directory: .
        run: python3 scripts/package-inspect.py node --platform-dirs crates/qrcode-ai-scanner-node/npm --strict --quiet
      # Idempotent: skip the main package if this version is already on npm
      - name: publish node main (skip if version already on npm)
        run: |
          VER=$(node -p "require('./package.json').version")
          if curl -fsS -o /dev/null "https://registry.npmjs.org/@supernovae-st%2fqrcode-ai-scanner/$VER"; then
            echo "already published @$VER - skipping"
          else
            npm publish --access public
          fi

  build-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # wasm-pack pinned exact, SHA-verified by install-action: the archived
      # rustwasm installer script it replaces silently served v0.13.1.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      # apt's binaryen is too old for Rust >=1.87 wasm output (the same
      # reason build-wasm.sh refuses wasm-pack's bundled wasm-opt) - pin the
      # release proven locally
      - run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_130/bin" >> "$GITHUB_PATH"
      # build · wasm-opt · patch · type sync · test.mjs
      - run: ./scripts/build-wasm.sh
      - name: pack + inspect the wasm tarball
        run: python3 scripts/package-inspect.py wasm --no-build --strict --quiet
      - uses: actions/upload-artifact@v7
        with:
          name: npm-wasm-package
          path: crates/qrcode-ai-scanner-wasm/pkg
          if-no-files-found: error

  publish-wasm:
    needs: build-wasm
    # refs/tags/v* only: no other ref reaches the registry.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + automatic provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: python3 scripts/package-inspect.py versions --tag "$GITHUB_REF" --strict --quiet
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $v cannot publish through trusted publishing (needs >= 11.5.1)"
            exit 1
          fi
          echo "npm $v"
      # the very pkg/ build-wasm built, smoke-tested and inspected
      - uses: actions/download-artifact@v8
        with:
          name: npm-wasm-package
          path: wasm-pkg
      # idempotent: skip publish if this version is already on npm (safe re-runs)
      - name: publish wasm (skip if version already on npm)
        working-directory: wasm-pkg
        run: |
          VER=$(node -p "require('./package.json').version")
          if curl -fsS -o /dev/null "https://registry.npmjs.org/@supernovae-st%2fqrcode-ai-scanner-wasm/$VER"; then
            echo "already published @$VER - skipping"
          else
            npm publish --access public
          fi

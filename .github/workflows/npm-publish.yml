name: npm-publish

# Builds the napi platform matrix + the wasm package and publishes both npm
# packages. Trigger: release tag vX.Y.Z. Requires the NPM_TOKEN repo secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        # --use-napi-cross is Linux-gnu-only (napi CLI >=3.7.3 hard-errors on
        # mac/windows hosts AND on musl targets); darwin/windows rows build
        # natively, musl rides zig (-x + setup-zig + cargo-zigbuild, the
        # official napi-rs template recipe).
        settings:
          - { host: macos-latest, target: aarch64-apple-darwin, cross: "" }
          - { host: macos-latest, target: x86_64-apple-darwin, cross: "" }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: "--use-napi-cross" }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: "--use-napi-cross" }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: "-x" }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, cross: "" }
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: crates/qrcode-ai-scanner-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec napi build --platform --release --target ${{ matrix.settings.target }} --js native.js --dts native.d.ts ${{ matrix.settings.cross }}
      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.settings.target }}
          path: crates/qrcode-ai-scanner-node/*.node
          if-no-files-found: error

  publish-native:
    needs: build-native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/qrcode-ai-scanner-node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile=false
      - uses: actions/download-artifact@v4
        with:
          path: crates/qrcode-ai-scanner-node/artifacts
      # napi v3: scaffold the per-platform npm/<triple>/ dirs before artifacts
      - run: pnpm exec napi create-npm-dirs
      - run: pnpm exec napi artifacts
      # Self-detecting + idempotent: if the platform packages for THIS version are
      # already on npm (re-run / partial-publish recovery), skip re-publishing them;
      # otherwise publish fresh. No version-specific flag to remember.
      - name: detect already-published platform packages
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@supernovae-st/qrcode-ai-scanner-darwin-arm64@$VER" version >/dev/null 2>&1; then
            echo "platform packages already on npm @$VER - will skip optional publish"
            echo "SKIP_OPTIONAL=--skip-optional-publish" >> "$GITHUB_ENV"
          else
            echo "fresh release @$VER - platform packages will publish"
            echo "SKIP_OPTIONAL=" >> "$GITHUB_ENV"
          fi
      - run: pnpm exec napi pre-publish -t npm --no-gh-release $SKIP_OPTIONAL
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Idempotent: skip the main package if this version is already on npm
      - name: publish node main (skip if version already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@supernovae-st/qrcode-ai-scanner@$VER" version >/dev/null 2>&1; then
            echo "already published @$VER - skipping"
          else
            npm publish --access public
          fi

  publish-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      # apt's binaryen is too old for Rust >=1.87 wasm output (the same
      # reason build-wasm.sh refuses wasm-pack's bundled wasm-opt) - pin the
      # release proven locally
      - run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz | tar xz -C /tmp
          echo "/tmp/binaryen-version_130/bin" >> "$GITHUB_PATH"
      - run: ./scripts/build-wasm.sh
      # idempotent: skip publish if this version is already on npm (safe re-runs)
      - name: publish wasm (skip if version already on npm)
        working-directory: crates/qrcode-ai-scanner-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@supernovae-st/qrcode-ai-scanner-wasm@$VER" version >/dev/null 2>&1; then
            echo "already published @$VER - skipping"
          else
            npm publish --access public
          fi

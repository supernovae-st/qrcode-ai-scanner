name: python

# Build + test the PyO3 binding (crates/qrcode-ai-scanner-py) and, on a vX.Y.Z
# tag, build wheels for the common platforms + sdist and publish to PyPI via
# trusted publishing (OIDC — no token). The crate is excluded from the cargo
# workspace, so the core `ci` workflow doesn't cover it; this does.
#
# Publishing is tag-only: `release` runs for refs/tags/v* alone. A
# workflow_dispatch from a branch builds every wheel + the sdist and inspects
# them (`inspect`), then stops. PyPI's trusted publisher is bound to this
# file and the `release` environment (RELEASING.md § Publishing). `release`
# reads back exactly what it uploads: one wheel per row of the wheels matrix
# and the sdist, nothing else; a file PyPI already serves at the version must
# be the one read back. The jobs whose outputs ship pin maturin-action by
# commit and use no sccache on a tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain CI tests (ci.yml RUST_TOOLCHAIN; RELEASING.md § toolchain),
  # handed to maturin-action, which installs it (inside the manylinux
  # container too). maturin pinned exact: the version PR CI already resolved.
  RUST_TOOLCHAIN: "1.97.0"
  MATURIN_VERSION: v1.15.0

defaults:
  run:
    working-directory: crates/qrcode-ai-scanner-py

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/qrcode-ai-scanner-py
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: build
          args: --release --locked --out dist
          sccache: "true"
      # Install the wheel just built BY PATH: resolving the name against
      # --find-links worked only while the local wheel's platform tag outranked
      # the registry's.
      - name: install the wheel just built + pytest
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found: ${wheels[*]}"
            exit 1
          fi
          pip install "${wheels[0]}[test]"
          pytest python/tests -q
      # The type stub as the oldest supported checker target reads it:
      # NotRequired comes from typing_extensions below Python 3.11, and the
      # report's optional keys and nullable score must type-check there.
      - name: type-check the stub for Python 3.10
        run: |
          pip install "mypy==1.15.0"
          mypy --python-version 3.10 --strict qrcode_ai_scanner.pyi
      # The sdist on every PR too: its file set and its PEP 639 license files
      # are judged here, not first at the tag.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/qrcode-ai-scanner-py
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      # the wheel and the sdist read back: the AGPL text where PEP 639 puts it,
      # METADATA version + license expression, the type stubs, the exact wheel
      # file set, only git-tracked files in the sdist
      - name: inspect the wheel and the sdist
        run: python3 ../../scripts/package-inspect.py archive dist/*.whl dist/*.tar.gz --strict --quiet

  wheels:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04, target: aarch64, manylinux: auto }
          - { runner: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          # Intel-mac wheel cross-compiled on the Apple-Silicon runner — the
          # macos-13 (Intel) runner is being retired by GitHub and stalled the job.
          - { runner: macos-latest, target: x86_64, manylinux: "" }
          - { runner: macos-latest, target: aarch64, manylinux: "" }
          - { runner: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/qrcode-ai-scanner-py
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist
          # No compiler cache on a tag: the wheels that ship build from the
          # tag alone, never from objects a branch run cached.
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: crates/qrcode-ai-scanner-py/dist
          if-no-files-found: error

  sdist:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/qrcode-ai-scanner-py
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: crates/qrcode-ai-scanner-py/dist
          if-no-files-found: error

  # Every archive PyPI would receive, read back before anything publishes —
  # on a branch dispatch too: the AGPL text in each wheel's
  # .dist-info/licenses/ and at the sdist root (PEP 639), the METADATA version
  # and license expression, the type stubs, the exact file sets.
  inspect:
    name: inspect wheels + sdist
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/package-inspect.py archive dist/* --release-set --strict --quiet
      # The sdist as pip uses it where no wheel fits: a PEP 517 build in an
      # isolated environment, whose wheel must carry the AGPL text like the
      # ones built above. Pinned like every other maturin leg: the maturin of
      # MATURIN_VERSION (a build constraint, in both of pip's spellings: pip
      # >= 26.2 reads only PIP_BUILD_CONSTRAINT, pip < 25.3 only
      # PIP_CONSTRAINT), proved by the wheel's own Generator line, and the
      # sdist's shipped Cargo.lock (--locked). The pyproject's floor,
      # maturin 1.9.3, is not exercised here.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: build a wheel from the sdist + inspect it
        env:
          MATURIN_PEP517_ARGS: --locked
          PIP_CONSTRAINT: ${{ runner.temp }}/maturin-constraint.txt
          PIP_BUILD_CONSTRAINT: ${{ runner.temp }}/maturin-constraint.txt
        run: |
          echo "maturin==${MATURIN_VERSION#v}" > "$PIP_BUILD_CONSTRAINT"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/from-sdist" dist/*.tar.gz
          unzip -p "$RUNNER_TEMP"/from-sdist/*.whl '*.dist-info/WHEEL' | grep -Fx "Generator: maturin (${MATURIN_VERSION#v})"
          python scripts/package-inspect.py archive "$RUNNER_TEMP"/from-sdist/*.whl --strict --quiet
      # Deliberately outside wheels-*: this reconstructed wheel is consumer
      # evidence, never an extra file in the six-wheel PyPI release set.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: sdist-rebuilt-wheel
          path: ${{ runner.temp }}/from-sdist/*.whl
          if-no-files-found: error

  consume-wheels:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: inspect
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        platform:
          - { runner: ubuntu-24.04, tag: 'manylinux.*x86_64', label: linux-x64-gnu }
          - { runner: ubuntu-24.04-arm, tag: 'manylinux.*aarch64', label: linux-arm64-gnu }
          - { runner: macos-15, tag: 'macosx.*arm64', label: darwin-arm64 }
          - { runner: macos-15-intel, tag: 'macosx.*x86_64', label: darwin-x64 }
          - { runner: windows-2025, tag: 'win_amd64', label: win32-x64 }
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: ${{ runner.temp }}/wheel-tarballs
          merge-multiple: true
      - name: clean venv install + exact consumer assertions
        id: consumer
        env:
          WHEEL_TAG: ${{ matrix.platform.tag }}
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python scripts/packed-python-consumer.py "$RUNNER_TEMP/wheel-tarballs" \
            fixtures/clean/gen_v5_q.png "$version" "$WHEEL_TAG" --suite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: consumer-python-${{ matrix.python }}-${{ matrix.platform.label }}
          path: |
            ${{ steps.consumer.outputs.receipt }}
            ${{ steps.consumer.outputs.junit }}
          if-no-files-found: error

  consume-wheels-musl:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official Python Alpine amd64 manifests, resolved 2026-10-13.
          - { python: '3.11', image: 'python:3.11-alpine@sha256:bfebb8e11b53c46715fe3634e3b7bc5afb33b21ec82521539af1467c81ad3aed' }
          - { python: '3.14', image: 'python:3.14-alpine@sha256:7f2ec713f0436c59df2362d973b6a05af9e87ba78f0e94f5245c302984a7a1fd' }
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: ${{ runner.temp }}/wheel-tarballs
          merge-multiple: true
      - name: musl clean venv install + exact consumer assertions
        env:
          CONSUMER_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/musl"
          docker pull "$CONSUMER_IMAGE"
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          # Only the hash-pinned test dependencies use PyPI. The scanner
          # wheel still installs by exact local path with --no-index.
          docker run --rm --cpus 2 --memory 1g --pids-limit 128 \
            -v "$PWD:/source:ro" -v "$RUNNER_TEMP/wheel-tarballs:/archives:ro" \
            -v "$RUNNER_TEMP/musl:/tmp" "$CONSUMER_IMAGE" \
            python /source/scripts/packed-python-consumer.py /archives \
            /source/fixtures/clean/gen_v5_q.png "$version" musllinux --suite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: consumer-python-${{ matrix.python }}-linux-x64-musl
          path: |
            ${{ runner.temp }}/musl/qrscan-packed-python-*/receipt.json
            ${{ runner.temp }}/musl/qrscan-packed-python-*/pytest.xml
          if-no-files-found: error

  consume-sdist-wheel:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist-rebuilt-wheel
          path: ${{ runner.temp }}/sdist-wheel
      - name: install the wheel rebuilt from the shipped sdist in a fresh venv
        id: consumer
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python scripts/packed-python-consumer.py "$RUNNER_TEMP/sdist-wheel" \
            fixtures/clean/gen_v5_q.png "$version" 'linux_x86_64' --suite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: consumer-sdist-python-${{ matrix.python }}
          path: |
            ${{ steps.consumer.outputs.receipt }}
            ${{ steps.consumer.outputs.junit }}
          if-no-files-found: error

  release:
    name: publish to PyPI
    # refs/tags/v* only: a workflow_dispatch from a branch builds and
    # inspects above, and stops before the registry.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, inspect, consume-wheels, consume-wheels-musl, consume-sdist-wheel]
    runs-on: ubuntu-24.04
    environment: release
    # One publish per tag at a time: a dispatch on the tag waits for the
    # tag-push run instead of racing it.
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) — no PyPI token needed
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag must name the version being published, and the CHANGELOG
      # must carry its dated section (skip-existing would otherwise turn a
      # forgotten bump into a silent non-release).
      - run: python3 scripts/package-inspect.py versions --tag "$GITHUB_REF" --strict --quiet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      # What PyPI receives, read back here and not only in `inspect`: any job
      # of the run can add an artifact named wheels-*. Exactly one wheel per
      # row of the wheels matrix and the sdist, each passing its inspection.
      - name: re-inspect the exact set about to be uploaded
        run: python3 scripts/package-inspect.py archive dist/* --release-set --strict --quiet
      # skip-existing below makes twine skip a file PyPI already serves by its
      # name alone. So each such file must be the very file read back above:
      # PyPI's JSON for this version (a 404: nothing live) gives every live
      # file's sha256, and other bytes under a local name, a live file this set
      # does not hold, or an answer that cannot be read stop the job before
      # anything is uploaded. The probe reads the public JSON API: no
      # credential involved.
      - name: compare the files PyPI already serves with the inspected set
        run: python3 scripts/package-inspect.py pypi-live dist/* --strict --quiet
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
          skip-existing: true

name: mobile

# Build the Kotlin/Android (AAR) + Swift/iOS (xcframework) bindings from the
# shared UniFFI crate (crates/qrcode-ai-scanner-uniffi). That crate is excluded
# from the cargo workspace, so the core `ci` workflow doesn't cover it — this
# does. Generated Kotlin/Swift + the per-ABI .so + the xcframework are produced
# here from one commit (never checked into git): generating the bindings and
# building the native lib in the SAME run from the SAME commit is the structural
# guard against the UniFFI contract-checksum skew that crashes at startup
# (mobile plan §7 gotcha #2 / R2).
#
# Mobile does NOT use PyPI OIDC — there are no trusted-publisher artifacts here.
# v0.1 publish targets: JitPack (Android, see repo-root jitpack.yml) + a GitHub
# release asset (iOS xcframework zip, consumed by SwiftPM url+checksum). Maven
# Central + GPG signing is deferred to v0.2 (plan §4.3).
#
# Third-party (non actions/*) actions are SHA-pinned, like python.yml pins
# pypa/gh-action-pypi-publish.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # PR/push gate (mirrors python.yml's `test` job): host build of the wrapper +
  # a smoke binding generation, so a wrapper that won't compile or whose
  # metadata won't read fails CI before any tag.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The uniffi + py crates are workspace-EXCLUDED, so they can't inherit
      # `version.workspace = true` — their versions (and the Kotlin module's) are
      # hand-spelled and silently drift from the workspace SSOT. Catch it here on
      # every PR (the `xtask sync-version` the plan references doesn't exist yet).
      - name: versions agree across all publish surfaces
        run: |
          v() { grep -m1 -E '^version' "$1" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'; }
          vq() { grep -m1 -E '"version"' "$1" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'; }
          ws=$(v Cargo.toml)
          # swift is absent by design: SwiftPM versions ARE the git tags
          # (bindings/swift/Package.swift header) — nothing to sync there.
          declare -A got=(
            [workspace]="$ws"
            [uniffi]="$(v crates/qrcode-ai-scanner-uniffi/Cargo.toml)"
            [python]="$(v crates/qrcode-ai-scanner-py/Cargo.toml)"
            [kotlin]="$(v bindings/kotlin/qrcodeaiscanner/build.gradle.kts)"
            [node]="$(vq crates/qrcode-ai-scanner-node/package.json)"
            [flutter]="$(v bindings/flutter/pubspec.yaml)"
          )
          fail=0
          for k in "${!got[@]}"; do
            echo "  $k = ${got[$k]}"
            [ "${got[$k]}" = "$ws" ] || { echo "::error::$k version ${got[$k]} != workspace $ws"; fail=1; }
          done
          # On a v* tag the tag itself must match the workspace version —
          # a forgotten bump otherwise turns publish idempotency into a
          # silent non-release (npm-publish.yml / flutter.yml skip-if-exists).
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF#refs/tags/v}"
              echo "  tag = $tag"
              [ "$tag" = "$ws" ] || { echo "::error::tag v$tag != workspace $ws"; fail=1; }
              ;;
          esac
          exit $fail
      - name: build the uniffi wrapper (host)
        run: cargo build --release --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml
      - name: test the uniffi wrapper (profile parse · JSON envelope · FFI-safety no-panic)
        run: cargo test --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml
      - name: smoke-generate Kotlin bindings (metadata reads)
        run: |
          cargo run --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml --bin uniffi-bindgen -- \
            generate --library crates/qrcode-ai-scanner-uniffi/target/release/libqrcode_ai_scanner_uniffi.so \
            --language kotlin --out-dir /tmp/kotlin-smoke
          test -n "$(find /tmp/kotlin-smoke -name '*.kt' -print -quit)" \
            || { echo 'no .kt generated'; exit 1; }

  android:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      # SHA-pinned third-party action (nttld/setup-ndk v1.6.0). NDK r27: 16 KB
      # page-size safe for Android 15+ (plan §7 gotcha #8).
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: build .so per ABI (cargo-ndk → jniLibs)
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o bindings/kotlin/qrcodeaiscanner/src/main/jniLibs \
            build --release --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml
      - name: generate Kotlin bindings (same commit as the .so above)
        run: |
          cargo build --release --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml
          cargo run --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml --bin uniffi-bindgen -- \
            generate --library crates/qrcode-ai-scanner-uniffi/target/release/libqrcode_ai_scanner_uniffi.so \
            --language kotlin \
            --out-dir bindings/kotlin/qrcodeaiscanner/src/main/kotlin
      # The generated package MUST match consumer-rules.pro's -keep rule, or an
      # R8-minified consuming app crashes at runtime (the keep silently protects
      # nothing). Pin the contract here.
      - name: generated Kotlin package matches the ProGuard keep rule
        run: |
          pkg=uniffi.qrcode_ai_scanner_uniffi
          grep -rq "^package $pkg" bindings/kotlin/qrcodeaiscanner/src/main/kotlin \
            || { echo "::error::generated package != '$pkg' (update consumer-rules.pro)"; exit 1; }
          grep -q "keep class $pkg" bindings/kotlin/qrcodeaiscanner/consumer-rules.pro \
            || { echo "::error::consumer-rules.pro has no -keep for '$pkg'"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # gradle/actions/setup-gradle provides `gradle` directly — no committed
      # wrapper jar needed here or on JitPack (jitpack.yml self-provisions Gradle 8.9).
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: assemble AAR
        working-directory: bindings/kotlin
        run: gradle :qrcodeaiscanner:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: bindings/kotlin/qrcodeaiscanner/build/outputs/aar/*.aar
          if-no-files-found: error
      # v0.1 Android publish = JitPack (repo-root jitpack.yml builds from the
      # tag). The AAR built here is the CI smoke + the artifact for download.
      # v0.2: maven-publish to Central in an env-gated release job (GPG secrets).

  ios:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15 # Xcode 16, Apple silicon
    permissions:
      contents: write # attach the xcframework to the GitHub release on tags
    steps:
      - uses: actions/checkout@v4
      # A committed Package.swift in dev (local-path) mode does NOT resolve for a
      # remote SwiftPM consumer — the path is git-ignored. A tagged release MUST
      # carry the url+checksum binaryTarget. bindings/swift/release.sh produces it.
      - name: guard — a tagged SwiftPM release needs url+checksum (not dev path mode)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -q 'path: "build/' bindings/swift/Package.swift; then
            echo "::error::bindings/swift/Package.swift is still in local-path (dev) mode."
            echo "::error::Run  bindings/swift/release.sh $GITHUB_REF_NAME  (on a mac) and commit"
            echo "::error::the url+checksum Package.swift it produces BEFORE pushing the tag."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: build static libs (device + both simulator arches)
        run: |
          cargo build --release --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml --target aarch64-apple-ios
          cargo build --release --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml --target aarch64-apple-ios-sim
          cargo build --release --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml --target x86_64-apple-ios
      - name: generate Swift sources + headers + xcframework modulemap
        run: |
          mkdir -p bindings/swift/Sources/QrcodeAiScanner build/swift/Modules
          cargo run --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml --bin uniffi-bindgen-swift -- \
            crates/qrcode-ai-scanner-uniffi/target/aarch64-apple-ios/release/libqrcode_ai_scanner_uniffi.a \
            bindings/swift/Sources/QrcodeAiScanner --swift-sources
          cargo run --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml --bin uniffi-bindgen-swift -- \
            crates/qrcode-ai-scanner-uniffi/target/aarch64-apple-ios/release/libqrcode_ai_scanner_uniffi.a \
            build/swift/Modules --headers --xcframework --modulemap --modulemap-filename module.modulemap
      - name: lipo simulator slice + create xcframework
        run: |
          mkdir -p build/sim
          lipo -create \
            crates/qrcode-ai-scanner-uniffi/target/aarch64-apple-ios-sim/release/libqrcode_ai_scanner_uniffi.a \
            crates/qrcode-ai-scanner-uniffi/target/x86_64-apple-ios/release/libqrcode_ai_scanner_uniffi.a \
            -output build/sim/libqrcode_ai_scanner_uniffi.a
          xcodebuild -create-xcframework \
            -library crates/qrcode-ai-scanner-uniffi/target/aarch64-apple-ios/release/libqrcode_ai_scanner_uniffi.a -headers build/swift/Modules \
            -library build/sim/libqrcode_ai_scanner_uniffi.a -headers build/swift/Modules \
            -output build/QrcodeAiScannerFFI.xcframework
      - name: zip + checksum
        run: |
          (cd build && zip -ry QrcodeAiScannerFFI.xcframework.zip QrcodeAiScannerFFI.xcframework)
          swift package compute-checksum build/QrcodeAiScannerFFI.xcframework.zip > build/checksum.txt
          echo "xcframework checksum: $(cat build/checksum.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: |
            build/QrcodeAiScannerFFI.xcframework.zip
            build/checksum.txt
          if-no-files-found: error
      # On a tag: make sure the release carries the xcframework, then VERIFY the
      # published asset's checksum equals the one Package.swift pins — so a
      # SwiftPM consumer's url+checksum resolution is guaranteed to succeed.
      # bindings/swift/release.sh is the authoritative publisher (it builds the
      # exact asset whose checksum it pins); this step is the safety net + the
      # CI-built fallback when no asset was attached yet.
      - name: publish + verify the xcframework asset (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 1. The release must exist — create if absent, else confirm. Never mask
          #    a real create failure behind `|| true` (that yields a confusing
          #    "release not found" on the next line instead of the root cause).
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          # 2. Attach the CI-built asset ONLY if none is present — never clobber a
          #    release.sh-published artifact, whose checksum is what Package.swift pins.
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
               | grep -qx 'QrcodeAiScannerFFI.xcframework.zip'; then
            echo "::notice::xcframework asset already attached — leaving it untouched."
          else
            gh release upload "$GITHUB_REF_NAME" build/QrcodeAiScannerFFI.xcframework.zip build/checksum.txt
            echo "::notice::attached the CI-built xcframework."
          fi
          # 3. VERIFY the PUBLISHED asset (whoever uploaded it) matches the pin.
          gh release download "$GITHUB_REF_NAME" -p QrcodeAiScannerFFI.xcframework.zip -O /tmp/published.zip --clobber
          published="$(swift package compute-checksum /tmp/published.zip)"
          pinned="$(grep -oE '[a-f0-9]{64}' bindings/swift/Package.swift | head -n1 || true)"
          echo "published asset : $published"
          echo "Package.swift   : ${pinned:-<none>}"
          if [ "$published" != "${pinned:-}" ]; then
            echo "::error::checksum mismatch — SwiftPM would reject this release."
            echo "::error::Re-run  bindings/swift/release.sh $GITHUB_REF_NAME  so the pin matches the asset."
            exit 1
          fi
          echo "::notice::SwiftPM checksum verified — the release resolves cleanly."

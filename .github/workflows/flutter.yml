name: flutter

# Flutter/Dart binding (bindings/flutter), built from the in-package Rust crate
# (bindings/flutter/rust) via flutter_rust_bridge + cargokit. The host `test` job
# runs on every push/PR; the native build jobs + pub.dev publish are tag-gated.
#
# pub.dev publish uses OIDC automated publishing (no token) — configure it on the
# package admin page first (bind this repo + tag pattern `v{{version}}` + the
# `pub` environment). Unlike npm/PyPI there is NO skip-existing: bump the
# pubspec version before tagging. Publishing is tag-push-only; every other run
# stops at the builds.
#
# This workflow takes no untrusted event input into any run: step (github.ref /
# github.event_name are used only in if: conditions), so it is injection-safe.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/flutter

env:
  CARGO_TERM_COLOR: always
  # The toolchain CI tests (ci.yml RUST_TOOLCHAIN; RELEASING.md § toolchain),
  # for every plain cargo call here. The one exception is cargokit: `flutter
  # build` compiles the crate through `rustup run <channel> cargo`, and
  # cargokit only knows the stable / beta / nightly channels
  # (cargokit/build_tool/lib/src/options.dart), so the device builds below
  # use the moving stable — as does every consuming app's build. pub.dev
  # ships the sources, not those binaries.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  # Host gate: analyze + the report.dart contract tests, plus a FRB regen-drift
  # check so a change to rust/src/api/*.rs without re-running `generate` fails CI.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/flutter/rust
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
      - run: flutter pub get
      # What pub.dev would receive (`pub publish --dry-run`), read back on
      # every PR: the AGPL text, the file set, no stray file. BLOCKED (the
      # crate's path dependency outside the package) is reported, not failed.
      - name: inspect the pub.dev package
        working-directory: .
        run: python3 scripts/package-inspect.py flutter --strict --quiet
      - run: flutter analyze
      - name: report.dart contract tests (host)
        run: flutter test
      - name: FRB bindings are in sync with rust/src/api (no drift)
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
          flutter_rust_bridge_codegen generate
          if ! git diff --quiet -- lib/src/rust rust/src/frb_generated.rs; then
            echo "::error::generated FRB bindings are stale — run flutter_rust_bridge_codegen generate and commit"
            git --no-pager diff --stat -- lib/src/rust rust/src/frb_generated.rs
            exit 1
          fi

  build-android:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/flutter/rust
      # NDK r27 = 16 KB page-size safe for Android 15+ (cargokit links the .so).
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      # `flutter build apk` drives cargokit, which cross-compiles the Rust crate
      # per ABI and bundles the .so — the real end-to-end Android build.
      - name: build the example APK (exercises cargokit android path)
        working-directory: bindings/flutter/example
        run: flutter build apk --debug

  build-ios:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15 # Xcode 16, Apple silicon
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/flutter/rust
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
      # `flutter build ios` drives cargokit's podspec script_phase (builds the
      # static lib, force-loads it) — the real end-to-end iOS build.
      - name: build the example iOS app (exercises cargokit ios path)
        working-directory: bindings/flutter/example
        run: flutter build ios --debug --no-codesign

  publish:
    name: publish to pub.dev
    # A pushed v* tag only. pub.dev accepts automated publishing solely from
    # the push of a tag matching the configured pattern, so a dispatch could
    # not publish anyway — and must not try.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-android, build-ios]
    runs-on: ubuntu-24.04
    # v0.5.0 post-mortem: without the token exchange below, `pub publish` falls
    # back to INTERACTIVE auth and hangs on stdin forever (the job sat 2 h and
    # was hand-cancelled). Cap the whole job well under the 6 h runner default.
    timeout-minutes: 15
    environment: pub
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    # The one privileged job on floating tools: the Flutter and Dart SDKs come
    # from the stable channel, and `flutter pub get` resolves without a
    # lockfile. A named exception in scripts/check-publish-guards.py, keyed to
    # exactly those three steps, while the job is dormant (pub.dev's first
    # upload is manual and the package's crate still depends on a path outside
    # it); it ends before the pub.dev trusted publisher is configured
    # (RELEASING.md § Publishing).
    permissions:
      contents: read
      id-token: write # OIDC — pub.dev automated publishing, no token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag must name the version being published, and the CHANGELOG
      # must carry its dated section.
      - name: the tag names the version being published
        working-directory: .
        run: python3 scripts/package-inspect.py versions --tag "$GITHUB_REF" --strict --quiet
      # The OIDC→pub.dev temporary-credential exchange. subosito/flutter-action
      # does NOT perform it; dart-lang/setup-dart does (its documented
      # publishing support). Order matters: exchange first, then the Flutter
      # toolchain lands its own dart on PATH — the credential store is shared.
      #
      # FIRST publish of a package cannot be automated at all: pub.dev only
      # accepts OIDC from a package whose admin has enabled GitHub-Actions
      # publishing — a setting that exists only once the package exists. The
      # first `flutter pub publish` is a manual operator act (Google account),
      # then enable automated publishing (repo supernovae-st/qrcode-ai-scanner,
      # tag pattern v{{version}}, required environment `pub`) and every later
      # tag publishes hands-free.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
      - run: flutter pub get
      # The package about to be uploaded, read back first (`pub publish
      # --dry-run`, which runs no package code), as flutter › test does.
      - name: inspect the pub.dev package about to be uploaded
        working-directory: .
        run: python3 scripts/package-inspect.py flutter --strict --quiet
      - name: publish (OIDC)
        run: flutter pub publish --force

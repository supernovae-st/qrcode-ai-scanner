name: dockerhub-consumers

# Read-only qualification of the immutable mirror; this workflow never publishes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consume:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pull the exact mirror anonymously and execute on the native host
        env:
          QRSCAN_ARCHITECTURE: ${{ matrix.architecture }}
          QRSCAN_IMAGE: docker.io/thibautmelen/qrcode-ai-scanner@sha256:48b40b5f1abcf6eeb52b93bc0c8b9413babfe24801b8a8925b2bdaba507df23b
          DOCKER_CONFIG: ${{ runner.temp }}/qrscan-dockerhub-public
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          for key in ('DOCKER_AUTH_CONFIG', 'REGISTRY_AUTH_FILE', 'REGCTL_CONFIG'):
              assert not os.environ.get(key), 'unexpected registry authentication override'
          config = Path(os.environ['DOCKER_CONFIG'])
          config.mkdir(mode=0o700)
          # A nonempty, credential-free entry prevents Docker's ambient helper autodetection.
          (config / 'config.json').write_text(json.dumps({'auths': {'https://index.docker.io/v1/': {}}}) + '\n')
          spec = importlib.util.spec_from_file_location('oci_contract', 'distribution/docker/publish.py')
          contract = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(contract)
          contract.load_bom()
          contract.native_host(os.environ['QRSCAN_ARCHITECTURE'])
          PY
          docker pull --platform "linux/$QRSCAN_ARCHITECTURE" "$QRSCAN_IMAGE"
          python3 distribution/docker/verify.py "$QRSCAN_IMAGE" fixtures/clean/gen_v5_q.png --expected-platform "linux/$QRSCAN_ARCHITECTURE" --receipt "public/$QRSCAN_ARCHITECTURE.json"
          python3 distribution/docker/publish.py record-consumer --architecture "$QRSCAN_ARCHITECTURE" --receipt "public/$QRSCAN_ARCHITECTURE.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          assert json.loads((Path(os.environ['DOCKER_CONFIG']) / 'config.json').read_text()) == {'auths': {'https://index.docker.io/v1/': {}}}
          receipt = Path('public') / (os.environ['QRSCAN_ARCHITECTURE'] + '.json')
          result = json.loads(receipt.read_text())
          assert result['image'] == os.environ['QRSCAN_IMAGE']
          result.update({'anonymous_pull': True, 'public_registry': 'docker.io', 'public_index_digest': os.environ['QRSCAN_IMAGE'].split('@', 1)[1]})
          receipt.write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qrscan-dockerhub-public-${{ matrix.architecture }}
          path: public/
          if-no-files-found: error

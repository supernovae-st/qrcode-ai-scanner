# One-shot diagnostic: does `cargo build --release -p xtask` explode on
# x86_64-linux stable WITHOUT the shared rust-cache? Discriminates the two
# remaining theories for the deep-checks runner deaths (run 28862018546
# died requesting 14 GiB DURING THE BUILD — rustc, not our scan path):
#   dies here too  → rustc 1.96.x x86_64 regression on this tree
#                    (fix: pin the CI toolchain until upstream fixes)
#   passes here    → poisoned Swatinem/rust-cache entry
#                    (fix: bump the cache key / prime a fresh cache)
# Dispatch-only. -j1 serializes rustc so the dying crate is unambiguous.
name: toolchain-probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "bounded diagnostic to run"
        type: choice
        options: [build, warp-mutations, oracle-artifact, debt-baseline, debt-paired, release-prepare, api-compat, registry-consumers]
        default: build
      baseline_sha:
        description: "40-hex qualified baseline (required for warp/debt probes)"
        default: ""
      toolchain:
        description: "rust toolchain to probe (empty: the pinned RUST_TOOLCHAIN)"
        default: ""
      version:
        description: "Exact next version for release-prepare; no commit, tag or upload"
        default: ""
      candidate_sha:
        description: "40-hex candidate for api-compat; checked independently of the diagnostic branch"
        default: ""

permissions:
  contents: read

env:
  # The toolchain CI tests (ci.yml RUST_TOOLCHAIN; RELEASING.md § toolchain).
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  registry-consumers:
    if: inputs.probe == 'registry-consumers'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      REGISTRY_TARGET: ${{ matrix.target }}
      PYTHONUTF8: "1" # Retain Unicode CLI diagnostics on Windows too.
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "1"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://index.crates.io/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2d3b577582979f0dc603b5cb0d96d1be02b459f5
          path: qualified-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, resolved 2026-10-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: install exact crates.io core and CLI outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qualified-source rev-parse HEAD)" = 2d3b577582979f0dc603b5cb0d96d1be02b459f5
          python3 harness/scripts/registry-rust-consumer.py \
            --source qualified-source --output "$RUNNER_TEMP/registry-qualified"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: registry-consumers-${{ matrix.target }}-0.10.0
          path: ${{ runner.temp }}/registry-qualified/proof/
          if-no-files-found: error
          retention-days: 14

  # No untrusted input enters shell source: the only revision input is passed
  # through env, checked as 40 lowercase hex, then verified after checkout.
  # Diagnostic only; patch asks every real lint to judge compatibility despite
  # the 0.x minor version bump. It is not a publication or comparative score.
  api-compat:
    if: inputs.probe == 'api-compat'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz
            sha256: cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65
            bytes: 8397378
          - os: macos-14
            target: aarch64-apple-darwin
            asset: cargo-semver-checks-aarch64-apple-darwin.tar.gz
            sha256: 3cec5da41eee9a3336d75ad43d1f30a5c9680818f4ba209024786f452cabab5b
            bytes: 7525750
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: cargo-semver-checks-x86_64-pc-windows-msvc.zip
            sha256: 7663ba2c938b59f0476d375ee1b5d8bece36a81819612d1541bc6ccf6316c4b7
            bytes: 7901345
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      BASELINE_SHA: "170e3fb30008f0dc20793712213f7d4c6f2d233e" # v0.9.0^{commit}
      API_TARGET: ${{ matrix.target }}
      TOOL_ASSET: ${{ matrix.asset }}
      TOOL_SHA256: ${{ matrix.sha256 }}
      TOOL_BYTES: ${{ matrix.bytes }}
      CARGO_BUILD_JOBS: "2"
      RUSTC_BOOTSTRAP: "1" # Stable 1.97 rustdoc JSON only; same for both inputs.
      RUSTFLAGS: "--cap-lints=allow"
    steps:
      - name: require an immutable candidate and initialize retained evidence
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_ROOT="$RUNNER_TEMP/api-qualified"
          echo "PROOF_ROOT=$PROOF_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_ROOT"
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full immutable commit SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: api-candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "170e3fb30008f0dc20793712213f7d4c6f2d233e"
          path: api-baseline
          fetch-depth: 0
          persist-credentials: false
      - name: verify both checked-out revisions and the fixed release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C api-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C api-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C api-baseline rev-parse 'v0.9.0^{commit}')" = "$BASELINE_SHA"
          test "$(git -C api-baseline rev-parse v0.9.0)" = "6def484ef193897590b862597ec0d8c3f6211d3a"
          git -C api-candidate diff --exit-code
          git -C api-baseline diff --exit-code
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, resolved 2026-10-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: checksum-verified prebuilt API checker, never an installer build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.51.0/$TOOL_ASSET" \
            --output "$PROOF_ROOT/$TOOL_ASSET"
          python3 - <<'PYTOOL'
          import hashlib, json, os, pathlib, stat, tarfile, zipfile
          root = pathlib.Path(os.environ["PROOF_ROOT"])
          archive = root / os.environ["TOOL_ASSET"]
          assert archive.stat().st_size == int(os.environ["TOOL_BYTES"]), "upstream prebuilt size mismatch"
          expected = os.environ["TOOL_SHA256"]
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == expected, "upstream prebuilt checksum mismatch"
          binary_name = "cargo-semver-checks.exe" if os.name == "nt" else "cargo-semver-checks"
          files = {}
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive) as packed:
                  assert packed.testzip() is None
                  assert len({m.filename for m in packed.infolist()}) == len(packed.infolist())
                  for member in packed.infolist():
                      path = pathlib.PurePosixPath(member.filename)
                      assert not path.is_absolute() and ".." not in path.parts and "\\" not in member.filename
                      assert (member.external_attr >> 16) & 0o170000 in [0, stat.S_IFREG, stat.S_IFDIR]
                      if not member.is_dir():
                          files[member.filename] = packed.read(member)
          else:
              with tarfile.open(archive) as packed:
                  assert len({m.name for m in packed.getmembers()}) == len(packed.getmembers())
                  for member in packed.getmembers():
                      path = pathlib.PurePosixPath(member.name)
                      assert not path.is_absolute() and ".." not in path.parts and "\\" not in member.name
                      assert member.isfile() or member.isdir(), "nonregular tool member"
                      if member.isfile():
                          files[member.name] = packed.extractfile(member).read()
          binaries = [data for name, data in files.items() if pathlib.PurePosixPath(name).name == binary_name]
          assert len(binaries) == 1, "one exact upstream tool binary required"
          tool = root / "tool-bin" / binary_name
          tool.parent.mkdir()
          tool.write_bytes(binaries[0])
          tool.chmod(0o755)
          identity = {"version": "0.51.0", "upstream_source": "260fad71517e8b320c5c1ad1f367900ab37362a1",
                      "url": "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.51.0/" + archive.name,
                      "archive_sha256": actual, "archive_bytes": archive.stat().st_size,
                      "binary_sha256": hashlib.sha256(tool.read_bytes()).hexdigest(),
                      "target": os.environ["API_TARGET"]}
          (root / "tool-identity.json").write_text(json.dumps(identity, indent=2) + "\n", encoding="utf-8")
          PYTOOL
      - name: symmetric locked Rust 1.97 JSON inputs and all enabled features
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then ulimit -v 12582912; fi
          python3 - <<'PYDOC'
          import datetime, hashlib, json, os, pathlib, shutil, subprocess, sys, tomllib
          root = pathlib.Path(os.environ["PROOF_ROOT"])
          target = os.environ["API_TARGET"]
          assert sys.version_info[:2] == (3, 13)
          (root / "python.txt").write_text(sys.version + "\n", encoding="utf-8")
          assert os.environ["RUST_TOOLCHAIN"] == "1.97.0"
          rustc = subprocess.check_output(["rustc", "+1.97.0", "--version", "--verbose"], text=True, encoding="utf-8")
          assert "rustc 1.97.0 " in rustc and "host: " + target in rustc
          (root / "rustc.txt").write_text(rustc, encoding="utf-8")
          (root / "rustdoc.txt").write_text(subprocess.check_output(["rustdoc", "+1.97.0", "--version", "--verbose"], text=True, encoding="utf-8"), encoding="utf-8")
          flags = ["-Z", "unstable-options", "--document-private-items", "--document-hidden-items", "--output-format=json", "--cap-lints=allow"]
          def tracked_hashes(source):
              paths = subprocess.check_output(["git", "ls-files", "-z"], cwd=source).decode().split("\0")
              return {name: hashlib.sha256((source / name).read_bytes()).hexdigest() for name in paths if name}
          rows = []
          for label, sha in [("baseline", os.environ["BASELINE_SHA"]), ("candidate", os.environ["CANDIDATE_SHA"])]:
              source = pathlib.Path("api-" + label).resolve()
              assert subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=source, text=True, encoding="utf-8").strip() == sha
              out = root / label
              out.mkdir()
              env = dict(os.environ, CARGO_HOME=str(root.parent / ("api-" + label + "-cargo-home")),
                         CARGO_TARGET_DIR=str(root.parent / ("api-" + label + "-target")))
              lock = source / "Cargo.lock"
              lock_hash = hashlib.sha256(lock.read_bytes()).hexdigest()
              shutil.copyfile(lock, out / "Cargo.lock")
              sources_before = tracked_hashes(source)
              (out / "tracked-input-sha256.json").write_text(json.dumps(sources_before, indent=2) + "\n", encoding="utf-8")
              commands = [["cargo", "+1.97.0", "metadata", "--locked", "--all-features", "--filter-platform", target, "--format-version", "1"],
                          ["cargo", "+1.97.0", "rustdoc", "--locked", "-p", "qrcode-ai-scanner", "--lib", "--all-features", "--target", target, "--", *flags]]
              row = {"label": label, "source_sha": sha, "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], cwd=source, text=True, encoding="utf-8").strip(),
                     "started_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     "lock_sha256": lock_hash, "target": target, "all_features": True,
                     "cargo_home": env["CARGO_HOME"], "cargo_target_dir": env["CARGO_TARGET_DIR"], "commands": commands,
                     "version": tomllib.loads((source / "Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"]}
              rows.append(row)
              assert row["version"] == ("0.9.0" if label == "baseline" else "0.10.0")
              (root / "inputs.json").write_text(json.dumps(rows, indent=2) + "\n", encoding="utf-8")
              for i, command in enumerate(commands):
                  stdout = out / ("metadata.json" if i == 0 else "rustdoc.log")
                  with stdout.open("w", encoding="utf-8") as output, (out / f"command-{i}.stderr").open("w", encoding="utf-8") as errors:
                      result = subprocess.run(command, cwd=source, env=env, stdout=output, stderr=errors)
                  row.setdefault("exit_codes", []).append(result.returncode)
                  (root / "inputs.json").write_text(json.dumps(rows, indent=2) + "\n", encoding="utf-8")
                  if result.returncode:
                      print((out / f"command-{i}.stderr").read_text(encoding="utf-8")[-16000:], flush=True)
                      raise SystemExit(result.returncode)
              metadata = json.loads((out / "metadata.json").read_text(encoding="utf-8"))
              core = next(p for p in metadata["packages"] if p["name"] == "qrcode-ai-scanner" and pathlib.Path(p["manifest_path"]).parent == source / "crates/qrcode-ai-scanner")
              assert core["version"] == row["version"]
              row["registry_packages"] = [{"name": p["name"], "version": p["version"], "source": p["source"]}
                                           for p in metadata["packages"] if p["source"] and p["source"].startswith("registry+")]
              assert [p["version"] for p in row["registry_packages"] if p["name"] == "rxing"] == ["0.9.1"]
              node = next(n for n in metadata["resolve"]["nodes"] if n["id"] == core["id"])
              row["enabled_features"] = sorted(node["features"])
              assert row["enabled_features"] == ["default", "engine-rqrr", "engine-rxing", "parallel", "serde"]
              generated = pathlib.Path(env["CARGO_TARGET_DIR"]) / target / "doc/qrcode_ai_scanner.json"
              shutil.copyfile(generated, out / "rustdoc.json")
              row["rustdoc_sha256"] = hashlib.sha256(generated.read_bytes()).hexdigest()
              generated_json = json.loads(generated.read_text(encoding="utf-8"))
              row["rustdoc_format_version"] = generated_json["format_version"]
              row["rustdoc_crate_version"] = generated_json["crate_version"]
              assert row["rustdoc_crate_version"] == row["version"]
              assert hashlib.sha256(lock.read_bytes()).hexdigest() == lock_hash
              assert tracked_hashes(source) == sources_before
              row["all_tracked_source_hashes_unchanged"] = True
              row["finished_utc"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              assert subprocess.run(["git", "diff", "--exit-code"], cwd=source).returncode == 0
              (root / "inputs.json").write_text(json.dumps(rows, indent=2) + "\n", encoding="utf-8")
          assert len(rows) == 2 and rows[0]["rustdoc_format_version"] == rows[1]["rustdoc_format_version"]
          PYDOC
      - name: real patch compatibility lints, refuse zero-check success
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHECK'
          import datetime, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ["PROOF_ROOT"])
          env = dict(os.environ, PATH=str(root / "tool-bin") + os.pathsep + os.environ["PATH"])
          version = subprocess.check_output(["cargo", "+1.97.0", "semver-checks", "--version"], env=env, text=True, encoding="utf-8")
          assert version.strip() == "cargo-semver-checks 0.51.0"
          (root / "tool-version.txt").write_text(version, encoding="utf-8")
          # v0.51's top-level verbosity conflicts with its optional subcommand.
          # Omitting that subcommand invokes the same CheckRelease arguments.
          command = ["cargo", "+1.97.0", "semver-checks", "--verbose",
                     "--baseline-rustdoc", str(root / "baseline/rustdoc.json"),
                     "--current-rustdoc", str(root / "candidate/rustdoc.json"), "--release-type", "patch"]
          started = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with (root / "semver-checks.log").open("w", encoding="utf-8") as output:
              result = subprocess.run(command, env=env, stdout=output, stderr=subprocess.STDOUT)
          output = (root / "semver-checks.log").read_text(encoding="utf-8")
          print(output, flush=True)
          clean = re.sub(r"\x1b\[[0-9;]*m", "", output)
          selected = [(int(n), int(m)) for n, m in re.findall(r"Starting\s+(\d+)\s+checks,\s+(\d+)\s+unnecessary", clean)]
          counts = [n for n, _ in selected]
          real_checks = selected == [(229, 31)] and counts[0] > 0
          warnings = [line for line in clean.splitlines() if re.search(r"\bWARN(?:ING)?\b", line, re.IGNORECASE)]
          verdict = "PASS" if result.returncode == 0 and real_checks else "API_VIOLATIONS" if result.returncode == 100 and real_checks else "INCOMPLETE"
          if verdict == "PASS" and warnings:
              verdict = "WARNINGS_REQUIRE_REVIEW"
          receipt = {"command": command, "exit_code": result.returncode, "verdict": verdict,
                     "target": os.environ["API_TARGET"],
                     "diagnostic_harness_sha": os.environ["GITHUB_SHA"], "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
                     "actual_check_counts": counts, "nonzero_lints_required": True,
                     "actual_selection": selected, "expected_pinned_tool_selection": [229, 31],
                     "warning_lines": warnings, "started_utc": started,
                     "finished_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     "release_type_assumption": "patch", "qualification": "API compatibility diagnostic, no publication",
                     "baseline_sha": os.environ["BASELINE_SHA"], "candidate_sha": os.environ["CANDIDATE_SHA"]}
          (root / "api-compat.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          if verdict != "PASS":
              raise SystemExit(result.returncode if result.returncode else 1)
          PYCHECK
      - name: retain exact input, tool and log identities even after a failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYHASH'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["PROOF_ROOT"])
          root.mkdir(exist_ok=True)
          files = {str(path.relative_to(root)): {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "bytes": path.stat().st_size}
                   for path in root.rglob("*") if path.is_file() and not path.is_symlink()
                   and not any(part.endswith("-cargo-home") or part.endswith("-target") for part in path.relative_to(root).parts)
                   and path.name != "sha256.json"}
          (root / "sha256.json").write_text(json.dumps(files, indent=2) + "\n", encoding="utf-8")
          PYHASH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: api-compat-${{ matrix.target }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/api-qualified/
          if-no-files-found: error
          retention-days: 14

  release-prepare:
    if: inputs.probe == 'release-prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "1"
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, resolved 2026-10-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: prepare versions, preserved dependency graphs and actual CLI goldens
        run: python3 scripts/prepare-release.py --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/release-preparation"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-preparation-${{ inputs.version }}
          path: ${{ runner.temp }}/release-preparation/
          if-no-files-found: error

  build-no-cache:
    if: inputs.probe == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain || env.RUST_TOOLCHAIN }}
      - name: serialized uncached release build under the OOM guard
        run: |
          rustc --version --verbose
          df -h / && free -m
          ulimit -v 12582912
          RUST_BACKTRACE=full cargo build --release --locked -p xtask -j 1
          echo "BUILD OK — cache poisoning confirmed by elimination"

  # Diagnostic runtime only: build the exact oracle on a matching host, then
  # run it against local hash-verified corpora without uploading private data.
  oracle-artifact:
    if: inputs.probe == 'oracle-artifact'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_TARGET_DIR: "target/oracle-diagnostic-v1"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, resolved 2026-10-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, resolved 2026-10-12
        with:
          key: oracle-aarch64-apple-darwin-diagnostic-nolto-cgu8-v1
          workspaces: ". -> target/oracle-diagnostic-v1"
      # Unit/contract coverage belongs to the three-OS PR CI. This diagnostic
      # builds only the runtime: its profile is not a shipped artifact or a
      # performance baseline. Keep rxing's package overflow checks intact.
      - name: verify native source identity
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: bounded diagnostic native build
        timeout-minutes: 20
        shell: bash
        run: |
          python3 - <<'PYBUILD'
          import datetime, json, os, pathlib, signal, subprocess, sys, time
          command = ["cargo", "build", "--release", "--locked", "-p", "xtask"]
          wall_limit_seconds = 1140
          rss_limit_bytes = 4 * 1024**3
          started_utc = datetime.datetime.now(datetime.timezone.utc).isoformat()
          print(f"diagnostic build start: {started_utc} command={command}", flush=True)
          started, peak = time.monotonic(), 0
          child = None
          reason, exit_code = "exception", 1
          interrupted_signal = 0
          def interrupted(signum, _frame):
              global interrupted_signal
              interrupted_signal = signum
          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)
          try:
              child = subprocess.Popen(command, start_new_session=True)
              if interrupted_signal:
                  raise SystemExit(128 + interrupted_signal)
              while child.poll() is None:
                  if interrupted_signal:
                      raise SystemExit(128 + interrupted_signal)
                  rows = subprocess.check_output(["ps", "-axo", "pgid=,rss="], text=True)
                  rss = sum(int(row.split()[1]) * 1024 for row in rows.splitlines()
                            if len(row.split()) == 2 and int(row.split()[0]) == child.pid)
                  peak = max(peak, rss)
                  if rss > rss_limit_bytes or time.monotonic() - started > wall_limit_seconds:
                      reason, exit_code = "sampled-rss-or-wall-limit", 124
                      break
                  time.sleep(0.5)
              else:
                  if interrupted_signal:
                      raise SystemExit(128 + interrupted_signal)
                  reason, exit_code = "build-exit", child.returncode
          except SystemExit as error:
              reason, exit_code = "interrupted", error.code
          finally:
              # Cleanup the owned group, including descendants after leader exit.
              signal.signal(signal.SIGTERM, signal.SIG_IGN)
              signal.signal(signal.SIGINT, signal.SIG_IGN)
              if child is not None:
                  try:
                      os.killpg(child.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  deadline = time.monotonic() + 3
                  while time.monotonic() < deadline:
                      child.poll()
                      try:
                          os.killpg(child.pid, 0)
                      except ProcessLookupError:
                          break
                      time.sleep(0.1)
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  child.wait()
              result = {
                  "command": command, "started_utc": started_utc,
                  "finished_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "elapsed_seconds": time.monotonic() - started,
                  "wall_limit_seconds": wall_limit_seconds, "rss_limit_bytes": rss_limit_bytes,
                  "sampled_group_peak_rss_bytes": peak, "reason": reason, "exit_code": exit_code,
              }
              pathlib.Path("diagnostic-build.json").write_text(json.dumps(result, indent=2) + "\n")
              print(json.dumps(result), flush=True)
          sys.exit(exit_code)
          PYBUILD
      - name: record immutable diagnostic identity
        shell: bash
        run: |
          git diff --exit-code
          mkdir -p oracle-runtime
          cp "$CARGO_TARGET_DIR/release/xtask" oracle-runtime/xtask
          file oracle-runtime/xtask
          otool -L oracle-runtime/xtask
          python3 - <<'PYMETA'
          import hashlib, json, os, pathlib, subprocess, tomllib
          binary = pathlib.Path("oracle-runtime/xtask")
          version = subprocess.check_output(["rustc", "--version", "--verbose"], text=True)
          if "host: aarch64-apple-darwin" not in version:
              raise SystemExit("oracle artifact requires aarch64-apple-darwin")
          metadata = {
              "schema": "qrscan.oracle-runtime.v1",
              "source_sha": os.environ["GITHUB_SHA"],
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "target": "aarch64-apple-darwin",
              "build": {
                  "purpose": "diagnostic-accuracy-only",
                  "profile": "release",
                  "lto": os.environ["CARGO_PROFILE_RELEASE_LTO"],
                  "codegen_units": os.environ["CARGO_PROFILE_RELEASE_CODEGEN_UNITS"],
                  "cargo_jobs": os.environ["CARGO_BUILD_JOBS"],
                  "target_directory": os.environ["CARGO_TARGET_DIR"],
                  "rxing_overflow_checks": tomllib.loads(pathlib.Path("Cargo.toml").read_text())["profile"]["release"]["package"]["rxing"]["overflow-checks"],
                  "rustflags": os.environ.get("RUSTFLAGS", ""),
                  "guard": json.loads(pathlib.Path("diagnostic-build.json").read_text()),
              },
              "rustc": version,
              "sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "bytes": binary.stat().st_size,
          }
          pathlib.Path("oracle-runtime/identity.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PYMETA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: oracle-aarch64-apple-darwin-${{ github.sha }}
          path: oracle-runtime/
          if-no-files-found: error
          retention-days: 3

  warp-mutations:
    if: inputs.probe == 'warp-mutations'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        revision: [before, after]
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CARGO_BUILD_JOBS: "4"
      NEXTEST_TEST_THREADS: "2"
    steps:
      - name: isolate Cargo home and target on each runner
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home-${{ matrix.revision }}" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-${{ matrix.revision }}" >> "$GITHUB_ENV"
      - name: require an immutable baseline
        run: |
          if [[ ! "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::baseline_sha must be a full immutable commit SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision == 'before' && inputs.baseline_sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, resolved 2026-10-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.116
      - name: fixed warp cohort, with baseline enabled
        working-directory: candidate
        run: |
          ulimit -v 6291456
          python3 ../harness/scripts/mutation-focus.py run --out "$RUNNER_TEMP/warp-${{ matrix.revision }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: warp-${{ matrix.revision }}
          path: ${{ runner.temp }}/warp-${{ matrix.revision }}
          if-no-files-found: error

  warp-verdict:
    needs: warp-mutations
    if: inputs.probe == 'warp-mutations' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: warp-*
          path: warp-receipts
      - run: python3 scripts/mutation-focus.py selftest
      - name: actual misses before, actual test kills after
        shell: bash
        env:
          EXPECTED_BEFORE: ${{ inputs.baseline_sha }}
          EXPECTED_AFTER: ${{ github.sha }}
        run: python3 scripts/mutation-focus.py judge --before warp-receipts/warp-before --after warp-receipts/warp-after --expected-before "$EXPECTED_BEFORE" --expected-after "$EXPECTED_AFTER" | tee warp-verdict.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: warp-verdict
          path: warp-verdict.json


  # The existing dispatch entry can call a new branch-local workflow before
  # that workflow reaches the default branch. The fixed warp cohort is unchanged.
  debt-mutations:
    if: inputs.probe == 'debt-baseline' || inputs.probe == 'debt-paired'
    uses: ./.github/workflows/debt-mutations.yml
    with:
      baseline_sha: ${{ inputs.baseline_sha }}
      mode: ${{ inputs.probe == 'debt-baseline' && 'baseline' || 'paired' }}

name: deep-checks

on:
  schedule:
    - cron: "0 4 * * 1" # weekly, monday 04:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Sharded: the suite outgrew a single runner (203+ tests × every mutant —
  # the un-sharded job hit the 90-min wall on 2026-07-05 without finishing).
  # 4 shards ≈ 25 min each; add shards if the wall returns, never the
  # timeout (a longer wall just delays the report a week).
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - run: >
          cargo mutants -p qrcode-ai-scanner --shard ${{ matrix.shard }}/4
          --minimum-test-timeout 120 -- --all-features
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report-shard-${{ matrix.shard }}
          path: mutants.out

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Run every registered target. `fuzz/corpus/` is gitignored (absent on a
      # fresh checkout), so `mkdir -p` each target's primary corpus dir before
      # the run — libfuzzer errors on a missing corpus directory. Image targets
      # seed read-only from the tracked `fixtures/` tree; the bitstream target
      # carries its own committed seeds under its corpus dir. 300 s each keeps
      # the whole matrix inside the 30-min job budget.
      #
      # --target is EXPLICIT: taiki-e ships cargo-fuzz as a musl-static
      # binary and cargo-fuzz defaults --target to its OWN build triple, so
      # without this the job builds x86_64-unknown-linux-musl — where ASAN
      # is incompatible with static libc and the std isn't installed
      # (the 14s red of run 28735462680).
      - name: fuzz targets
        run: |
          for target in fuzz_scan_encoded fuzz_scan_full fuzz_rescue_bitstream fuzz_classify_text; do
            mkdir -p "fuzz/corpus/$target"
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
              "$target" "fuzz/corpus/$target" fixtures -- -max_total_time=300
          done

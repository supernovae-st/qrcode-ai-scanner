[workspace]
# resolver 3 = MSRV-aware resolution: any re-lock, under any toolchain,
# selects dependency versions compatible with the declared rust-version
# (the live class: image raised its floor 1.85 → 1.88 mid-cycle and a
# fresh resolution inherited it silently).
resolver = "3"
members = ["crates/*", "xtask"]
# The Python (PyO3/maturin), UniFFI (cargo-ndk/xcodebuild) and Flutter
# (flutter_rust_bridge/cargokit) bindings are built by foreign toolchains, not
# cargo workspace tooling — exclude them so `cargo test/clippy --workspace`
# (CI core) skips them. The flutter crate lives inside its pub.dev package.
exclude = [
  "crates/qrcode-ai-scanner-py",
  "crates/qrcode-ai-scanner-uniffi",
  "bindings/flutter/rust",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/supernovae-st/qrcode-ai-scanner"
authors = [
  "Thibaut MÉLEN <thibaut@supernovae.studio>",
  "SuperNovae <contact@supernovae.studio>",
]

[workspace.dependencies]
# engines — QR-only feature set verified against the published 0.9.1 tarball:
# `client_support` (chrono-tz/fancy-regex/uriparse payload parsing) is OFF — we own
# payload classification; `image`/`imageproc` are OFF — we feed raw luma buffers.
# wasm builds must add rxing `wasm_support` (chrono is an unconditional rxing dep).
rxing = { version = "0.9.1", default-features = false, features = [
  "decoders",
  "multi_barcode_readers",
  "full_barcode_format_support",
  "encoding_rs",
] }
rqrr = "0.10.1"

# imaging — formats limited to what the product accepts
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
] }

# text / serialization
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# errors
thiserror = "2"
miette = "7"

# time (Instant on wasm32) / parallelism (native only)
web-time = "1.1"
rayon = "1.10"

# cli
clap = { version = "4", features = ["derive"] }

# dev / test
qrcode = "0.14"
insta = { version = "1", features = ["json", "redactions"] }
jsonschema = { version = "0.47", default-features = false }
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }
pretty_assertions = "1"

[workspace.lints.rust]
missing_docs = "warn"
# cargo-fuzz builds the graph with --cfg fuzzing (fuzz-only pub surface)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# rxing 0.9.1 has at least one integer underflow on adversarial pixel
# patterns (oned/rss/rss_14_reader.rs:184 — reached by an occluded-finder QR
# in the QD-2 grid). In release the wrap produced a ~usize::MAX loop bound
# whose Vec doubled to a 14 GiB allocation request — the silent OOM that
# killed 6 consecutive deep-checks runners. With overflow checks the wrap
# becomes a panic, which the engine wrapper already catches and counts
# (report.trace.engine_panics). ~1-3% decode-throughput cost on one
# dependency, bought: no unbounded allocation from adversarial images.
[profile.release.package.rxing]
overflow-checks = true

# image decoding in tests is unusable at opt-level 0
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# JitPack build config — builds + publishes the Kotlin/Android AAR from a Git
# tag, with ZERO signing friction (uniffi mobile plan §4.3: JitPack-first,
# Maven Central deferred to v0.2).
#
# Consumer (after JitPack builds a tag vX.Y.Z):
#   repositories { maven { url = uri("https://jitpack.io") } }
#   implementation("com.github.supernovae-st:qrcode-ai-scanner:vX.Y.Z")
#
# Because the AAR embeds NDK-cross-compiled .so's, JitPack's build box must have
# the Rust toolchain + Android NDK + cargo-ndk, plus the per-ABI .so and the
# generated UniFFI Kotlin produced BEFORE Gradle assembles the AAR. The `install`
# block below does exactly that, then runs `maven-publish` (publishToMavenLocal)
# so JitPack picks up the artifact from the local Maven repo.

# JitPack runs on Ubuntu; pick a JDK with the AGP 8.x toolchain.
jdk:
  - openjdk17

before_install:
  # JitPack joins every command of a section into ONE `;`-chained shell line
  # (proven by the 9cbe59aa02 build log), so a leading `set -e` guards the
  # whole section. Without it, the SHA build published a 78 KB AAR with ZERO
  # .so inside — cargo-ndk had failed on a missing NDK, `;` marched on, and
  # gradle happily packaged an AAR that would UnsatisfiedLinkError at runtime.
  - set -e
  # Rust toolchain (matches the workspace rust-version 1.88) + Android targets.
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.88.0
  - source "$HOME/.cargo/env"
  - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
  - cargo install cargo-ndk --version 4.1.2 --locked
  # Android SDK — the JitPack image ships NO cmdline-tools at all (v2 proof
  # run 18cb85c1a0: ".../cmdline-tools/latest/bin/sdkmanager: No such file"),
  # so provision our own into $HOME like gradle below. Google's documented
  # layout: the zip's root `cmdline-tools/` dir must sit at
  # $SDK/cmdline-tools/latest. Licenses FIRST (a pending license makes
  # --install a silent no-op), install output visible, exact NDK path
  # verified loud before anything depends on it (NDK r27 = 16 KB page-safe).
  - curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
  - mkdir -p "$HOME/android-sdk/cmdline-tools"
  - unzip -q /tmp/clt.zip -d /tmp/clt
  - mv /tmp/clt/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
  - export ANDROID_HOME="$HOME/android-sdk"
  - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
  - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0" | tail -3
  - ls -d "$ANDROID_HOME/ndk/27.0.12077973"
  - printf 'sdk.dir=%s\nndk.dir=%s/ndk/27.0.12077973\n' "$ANDROID_HOME" "$ANDROID_HOME" > bindings/kotlin/local.properties
  # Gradle 8.9 (the AGP 8.5 toolchain) — provisioned here so JitPack needs NO committed
  # Gradle wrapper jar. Full path is used in `install` (PATH may not persist across steps).
  # $HOME, not /opt: the v0.5.0 build died exit-127 at the gradle step — /opt is
  # not writable for the jitpack build user and the quiet unzip swallowed the
  # failure. `-f` on curl + the trailing ls make the provisioning fail LOUD.
  - curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
  - unzip -q -o /tmp/gradle.zip -d "$HOME"
  - ls "$HOME/gradle-8.9/bin/gradle"

install:
  # Each yml section runs as its OWN ;-joined shell line — before_install
  # exports do NOT survive into here. Re-derive both SDK envs.
  - set -e
  - source "$HOME/.cargo/env"
  - export ANDROID_HOME="$HOME/android-sdk"
  - export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
  # 1. Build the per-ABI .so into the library module's jniLibs (cargo-ndk §4.1).
  - >
    cargo ndk
    -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86
    -o bindings/kotlin/qrcodeaiscanner/src/main/jniLibs
    build --release --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml
  # 2. Build the host cdylib + generate the UniFFI Kotlin into the module (§3.1).
  - cargo build --release --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml
  - >
    cargo run --manifest-path crates/qrcode-ai-scanner-uniffi/Cargo.toml --bin uniffi-bindgen --
    generate
    --library crates/qrcode-ai-scanner-uniffi/target/release/libqrcode_ai_scanner_uniffi.so
    --language kotlin
    --out-dir bindings/kotlin/qrcodeaiscanner/src/main/kotlin
  # 3. The anti-lying-AAR gate: all four ABI .so's must be IN the aar before
  #    it is allowed anywhere near a Maven repo. The 9cbe59aa02 SHA build
  #    shipped a 78 KB AAR with zero natives and called it success.
  - '"$HOME"/gradle-8.9/bin/gradle -p bindings/kotlin :qrcodeaiscanner:assembleRelease'
  - SO_COUNT=$(unzip -l bindings/kotlin/qrcodeaiscanner/build/outputs/aar/qrcodeaiscanner-release.aar | grep -c 'jni/.*\.so$')
  - echo "native libs in AAR = $SO_COUNT (need 4)"
  - test "$SO_COUNT" -eq 4
  # 4. Only a verified AAR gets published (JitPack serves the local repo).
  - '"$HOME"/gradle-8.9/bin/gradle -p bindings/kotlin :qrcodeaiscanner:publishToMavenLocal'

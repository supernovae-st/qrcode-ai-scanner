# Excluded from the workspace (see root Cargo.toml): built via cargo-ndk (Android
# .so) and cargo + xcodebuild (iOS xcframework), not by cargo workspace tooling.
# Versions are spelled out because excluded crates cannot inherit `workspace = true`.
[package]
name = "qrcode-ai-scanner-uniffi"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/supernovae-st/qrcode-ai-scanner"
description = "Kotlin/Android + Swift/iOS bindings for qrcode-ai-scanner via UniFFI."
publish = false

[lib]
# cdylib    → Android .so (loaded by JNA at runtime)
# staticlib → iOS .a (linked into the xcframework)
crate-type = ["cdylib", "staticlib"]
name = "qrcode_ai_scanner_uniffi"

[dependencies]
uniffi = { version = "0.31", features = ["cli"] }
serde_json = "1"
thiserror = "2"
# alias to dodge the name clash with this crate's lib name, same as the py crate.
scanner-core = { package = "qrcode-ai-scanner", path = "../qrcode-ai-scanner", features = ["serde"] }

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

# The standalone uniffi-bindgen binary (library-mode generation) lives in this
# crate so CI can `cargo run --bin uniffi-bindgen` with no separate install and
# no version skew between the lib's `uniffi` dep and the generator.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

# The dedicated Swift bindgen for the modern xcframework flow (emits the
# .swift, the FFI .h, and an xcframework-compatible modulemap). Same version-
# skew guard as the Kotlin bindgen above.
[[bin]]
name = "uniffi-bindgen-swift"
path = "uniffi-bindgen-swift.rs"

# Workspace-excluded, so cargo-ndk, JitPack and the iOS build compile this
# crate as its own cargo root and the workspace [profile.release] never
# applies (cargo reads profiles from the root manifest only). Restate its
# safety setting: rxing 0.9.1 can underflow on adversarial pixels, and
# overflow-checks turn that into a panic the engine wrapper catches instead of
# a runaway allocation (root Cargo.toml has the history). The size settings
# (lto · strip) change what JitPack and the xcframework ship and stay a
# separate decision.
[profile.release.package.rxing]
overflow-checks = true

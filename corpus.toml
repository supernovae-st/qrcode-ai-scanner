# Corpus manifest — ground truth for every fixture.
# `expected` absent = negative sample (must NOT decode).
# Categories: clean · artistic · degraded.
# Derived numbers (success rates) are NEVER hand-typed: `cargo run -p xtask --
# corpus-report --write` regenerates the README managed block from this file.
# `raw_hex` = the payload bytes (lowercase hex) when they are known
# independently of the scanner under test: the fixture generator's payload, or
# the bytes an independent reader returns. `eci` (the located designators,
# `[{ designator = 4, start = 0 }]`) and `fnc1` (`"first"` · `"second"`) join it
# when the symbol declares them; no symbol here does. An entry with `raw_hex` is
# judged by content identity (spec/01-report.md § Comparing contents), one
# without it by its text.

